version: '3.8'

services:
  file-mcp:
    image: cloud-dog/file-mcp-server:latest
    container_name: file-mcp-local
    network_mode: host
    env_file:
      - ${ENV_FILE:-tests/env-IT-local-docker}
    volumes:
      - ./.run:/app/.run
      - ./logs:/app/logs
      - ./storage:/app/storage
      - ./database:/app/database
      - ./tmp:/app/tmp
      - ./archive:/app/archive
      - ./certs:/app/certs
    command: ["serve"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:${FILE_MCP_HTTP_PORT:-18090}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

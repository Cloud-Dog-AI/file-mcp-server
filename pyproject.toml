[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "file-mcp-server"
version = "0.1.2RC1"
description = "File MCP server and reusable file tools"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "Apache-2.0" }
authors = [
  { name = "Cloud-Dog, Viewdeck Engineering Limited" }
]
dependencies = [
  "alembic>=1.13",
  "argon2-cffi>=23.0",
  "beautifulsoup4>=4.12,<5.0",
  "chardet>=5.2,<6.0",
  "cloud_dog_api_kit[change-stream-db]==0.14.1",
  "cloud_dog_config==0.3.5",
  "cloud_dog_db==0.3.3",
  "cloud_dog_idam==0.5.4",
  "cloud_dog_llm==0.4.1",
  "cloud_dog_jobs==0.4.4",
  "cloud_dog_logging==0.4.1",
  "cloud_dog_storage==0.1.8",
  "cryptography>=42.0",
  "deepdiff>=8.6.2,<9.0",
  "fastapi>=0.110,<1.0",
  "mcp>=1.26.0",
  "hvac>=2.0",
  "filelock>=3.15,<4.0",
  "jsonschema>=4.22,<5.0",
  "lxml>=6.1.0",
  "markdown-it-py>=3.0,<4.0",
  "openpyxl>=3.1,<4.0",
  "pdfminer.six>=20231228",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "PyYAML>=6.0.1,<7.0",
  "python-docx>=1.1,<2.0",
  "python-dotenv>=1.0,<2.0",
  "python-magic>=0.4.27,<1.0; platform_system != 'Windows'",
  "PyJWT[crypto]>=2.8",
  "pymysql>=1.1,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "requests>=2.31,<3.0",
  "rich>=13.7,<14.0",
  "ruamel.yaml>=0.18.6,<1.0",
  "SQLAlchemy>=2.0",
  "typer>=0.12,<1.0",
  "typing-extensions>=4.10,<5.0",
  "uvicorn>=0.30,<1.0",
  "watchdog>=4.0,<5.0",
]

[project.optional-dependencies]
dev = [
  "fastmcp>=3.2,<4.0",
  "mypy>=1.10,<2.0",
  "playwright>=1.52,<2.0",
  "pytest>=8.2,<9.0",
  "pytest-cov>=5.0,<6.0",
  "ruff>=0.5,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = [
  "src/file_mcp_server",
  "src/file_tools",
]

[tool.pytest.ini_options]
addopts = "-p no:cloud_dog_config"
testpaths = ["tests"]

markers = [
    "QT: Quick test",
    "UT: Unit test",
    "ST: System test",
    "IT: Integration test",
    "AT: Acceptance test",
    "api: REST API surface",
    "mcp: MCP surface",
    "a2a: A2A surface",
    "webui: WebUI surface",
    "cli: CLI surface",
    "internal: Internal",
    "negative: Negative flow",
    "probe: Probe (orphan, exempt from req)",
    "slow: Long-running",
    "llm: LLM endpoint required",
    "external: External service",
    "flaky: Known-flaky",
    "unit: Unit-test metadata alias (canonical tier marker remains UT)",
    "fast: Fast-running test metadata",
    "req(*ids): Bind to REQ-IDs",
]

[tool.ruff]
# W28R-3013 supply-chain remediation: project-local Python 3.13 runtime contract.
target-version = "py313"

[tool.mypy]
python_version = "3.13"

[[tool.mypy.overrides]]
module = ["cloud_dog_db", "cloud_dog_db.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["file_mcp_server.db.models", "file_mcp_server.db.runtime"]
disable_error_code = ["import-untyped"]

[project.urls]
"Source" = "https://github.com/cloud-dog-ai/file-mcp-server"

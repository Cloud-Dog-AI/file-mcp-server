[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "file-mcp-server"
version = "0.1.1"
description = "File MCP server and reusable file tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
  { name = "Cloud-Dog, Viewdeck Engineering Ltd." },
]
dependencies = [
  "alembic>=1.13",
  "argon2-cffi>=23.0",
  "beautifulsoup4>=4.12,<5.0",
  "chardet>=5.2,<6.0",
  "cloud_dog_api_kit>=0.2.0",
  "cloud_dog_config>=0.2.0",
  "cloud_dog_db>=0.1.0",
  "cloud_dog_idam>=0.2.0",
  "cloud_dog_logging>=0.2.0",
  "cryptography>=42.0",
  "deepdiff>=7.0,<8.0",
  "fastapi>=0.110,<1.0",
  "fastmcp",
  "hvac>=2.0",
  "filelock>=3.15,<4.0",
  "jsonschema>=4.22,<5.0",
  "lxml>=5.2,<6.0",
  "markdown-it-py>=3.0,<4.0",
  "openpyxl>=3.1,<4.0",
  "pdfminer.six>=20231228",
  "pydantic>=2.7,<3.0",
  "pydantic-settings>=2.2,<3.0",
  "PyYAML>=6.0.1,<7.0",
  "python-docx>=1.1,<2.0",
  "python-dotenv>=1.0,<2.0",
  "python-magic>=0.4.27,<1.0; platform_system != 'Windows'",
  "PyJWT[crypto]>=2.8",
  "requests>=2.31,<3.0",
  "rich>=13.7,<14.0",
  "ruamel.yaml>=0.18.6,<1.0",
  "SQLAlchemy>=2.0",
  "typer>=0.12,<1.0",
  "typing-extensions>=4.10,<5.0",
  "uvicorn>=0.30,<1.0",
  "watchdog>=4.0,<5.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2.0",
  "pytest>=8.2,<9.0",
  "pytest-cov>=5.0,<6.0",
  "ruff>=0.5,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = [
  "src/file_mcp_server",
  "src/file_tools",
]

[tool.pytest.ini_options]
addopts = "-p no:cloud_dog_config"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"

[[tool.mypy.overrides]]
module = ["cloud_dog_db", "cloud_dog_db.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["file_mcp_server.db.models", "file_mcp_server.db.runtime"]
disable_error_code = ["import-untyped"]

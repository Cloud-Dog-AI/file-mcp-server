profiles:
  default:
    server_id: "${FILE_MCP_SERVER_ID:file-mcp-local}"
    auth:
      api_keys:
        - "${FILE_MCP_API_KEY_PRIMARY}"
      header_name: "${FILE_MCP_AUTH_HEADER_NAME}"
      header_scheme: "${FILE_MCP_AUTH_HEADER_SCHEME}"
    storage:
      backend: "${FILE_MCP_STORAGE_BACKEND}"
      tls:
        insecure_skip_verify: "${FILE_MCP_STORAGE_TLS_INSECURE}"
        ca_bundle_path: "${FILE_MCP_STORAGE_TLS_CA_BUNDLE}"
      s3:
        endpoint: ""
        bucket: "${FILE_MCP_S3_BUCKET}"
        region: ""
        access_key: ""
        secret_key: ""
        prefix: "${FILE_MCP_S3_PREFIX}"
      webdav:
        base_url: ""
        username: ""
        password: ""
        move_retry_count: "3"
        move_retry_backoff_s: "1.0"
        move_probe_timeout_s: "5"
        move_retry_statuses: "423,502,503,504"
      ftp:
        host: ""
        port: "0"
        username: ""
        password: ""
        base_dir: "${FILE_MCP_FTP_BASE_DIR}"
        use_tls: "${FILE_MCP_FTP_USE_TLS}"
      google_drive:
        user_email: "${FILE_MCP_GDRIVE_USER_EMAIL}"
        folder_id: "${FILE_MCP_GDRIVE_FOLDER_ID}"
        folder_url: "${FILE_MCP_GDRIVE_FOLDER_URL}"
        folder_url_example: "${FILE_MCP_GDRIVE_FOLDER_URL_EXAMPLE:https://drive.google.com/drive/folders/}"
        client_id: ""
        client_secret: ""
        refresh_token: ""
        access_token: ""
        oauth_scope: "${FILE_MCP_GDRIVE_OAUTH_SCOPE:https://www.googleapis.com/auth/drive}"
        oauth_authorize_uri: "${FILE_MCP_GDRIVE_AUTHORIZE_URI:https://accounts.google.com/o/oauth2/v2/auth}"
        api_base_uri: "${FILE_MCP_GDRIVE_API_BASE_URI:https://www.googleapis.com/drive/v3}"
        upload_base_uri: "${FILE_MCP_GDRIVE_UPLOAD_BASE_URI:https://www.googleapis.com/upload/drive/v3}"
        redirect_uri: "${FILE_MCP_GDRIVE_REDIRECT_URI:urn:ietf:wg:oauth:2.0:oob}"
        token_uri: ""
    scope:
      roots:
        - "${FILE_MCP_ROOT}"
      allow_globs:
        - "**/*"
      deny_globs:
        - "**/.git/**"
      allowed_exts: []
      read_only_exts: []
    audit:
      log_path: "${FILE_MCP_AUDIT_LOG}"
      include_content_hashes: true
    snapshots:
      enabled: false
      mode: "none"
      dir: "${FILE_MCP_SNAPSHOT_DIR}"
      retention_days: 30
    validation:
      default_mode: "warn"
      per_type: {}
    conversion:
      enabled: false
      backends: []
      max_input_mb: 25
    observability:
      enabled: true
      log_path: "${FILE_MCP_SERVER_LOG}"
      level: "INFO"
    limits:
      search_max_results: 250
      search_max_file_mb: 5
      search_timeout_s: 30
      storage_timeout_s: 30
      conversion_timeout_s: 60
    jobs:
      enabled: "${FILE_MCP_JOBS_ENABLED:true}"
      backend: "${FILE_MCP_JOBS_BACKEND:sql}"
      queue_name: "${FILE_MCP_JOBS_QUEUE:file-mcp}"
      payload_max_bytes: "${FILE_MCP_JOBS_PAYLOAD_MAX_BYTES:65536}"
      sql_url: "${FILE_MCP_JOBS_SQL_URL:sqlite:///database/file_mcp.db}"
      redis_url: "${FILE_MCP_JOBS_REDIS_URL:disabled}"
      redis_key_prefix: "${FILE_MCP_JOBS_REDIS_KEY_PREFIX:file_mcp_jobs}"
      retry:
        max_attempts: 3
        initial_delay_seconds: 1.0
        max_delay_seconds: 30.0
      timeout:
        run_timeout_ms: 300000
        claim_timeout_ms: 60000
      maintenance:
        claim_timeout_seconds: 60
        max_age_seconds: 86400
      dead_letter:
        enabled: true
        queue_name: dead_letter
    endpoint_health:
      enabled: true
      check_on_startup: true
      check_all_configured_backends: true
      max_retries: 3
      retry_interval_s: 2
      retry_window_s: 30
      max_failures_before_restart: 5
      recover_after_s: 30
      restart_on_threshold: false
      restart_exit_code: 75

http:
  transport: "${FILE_MCP_HTTP_TRANSPORT}"
  host: "${FILE_MCP_HTTP_HOST}"
  fallback_host: "${FILE_MCP_HTTP_FALLBACK_HOST:127.0.0.1}"
  port: "${FILE_MCP_HTTP_PORT}"
  base_path: "${FILE_MCP_HTTP_BASE_PATH}"
  mcp_path: "${FILE_MCP_HTTP_MCP_PATH}"
  health_path: "${FILE_MCP_HTTP_HEALTH_PATH}"
  events_path: "${FILE_MCP_HTTP_EVENTS_PATH}"
  stateless_http: "${FILE_MCP_HTTP_STATELESS}"

# PS-92 server base_path (route prefix). The top-level `http.base_path` above is
# a distinct concern (MCP HTTP transport listener base — outbound HTTP connector
# target / transport root) and MUST NOT be conflated with the PS-92 per-server
# route prefixes below. Do not touch `http.base_path` when editing PS-92 keys.
api_server:
  host: "${CLOUD_DOG__API_SERVER__HOST:0.0.0.0}"
  port: "${CLOUD_DOG__API_SERVER__PORT:8060}"
  enabled: "${CLOUD_DOG__API_SERVER__ENABLED:true}"
  base_path: "/api/v1"  # PS-92 canonical API base path; legacy /app/v1 remains in code as hardcoded compat (W28A-970h-V2). Override via env CLOUD_DOG__API_SERVER__BASE_PATH (cloud_dog_config standard precedence).

web_server:
  host: "${CLOUD_DOG__WEB_SERVER__HOST:0.0.0.0}"
  port: "${CLOUD_DOG__WEB_SERVER__PORT:8061}"
  enabled: "${CLOUD_DOG__WEB_SERVER__ENABLED:true}"
  base_path: ""  # PS-92 canonical Web base path; empty for SPA/static catch-all. Override via env CLOUD_DOG__WEB_SERVER__BASE_PATH.

mcp_server:
  host: "${CLOUD_DOG__MCP_SERVER__HOST:0.0.0.0}"
  port: "${CLOUD_DOG__MCP_SERVER__PORT:8062}"
  transport: "${CLOUD_DOG__MCP_SERVER__TRANSPORT:streamable-http}"
  enabled: "${CLOUD_DOG__MCP_SERVER__ENABLED:true}"
  base_path: "/mcp"  # PS-92 canonical MCP base path. Override via env CLOUD_DOG__MCP_SERVER__BASE_PATH.

a2a_server:
  host: "${CLOUD_DOG__A2A_SERVER__HOST:0.0.0.0}"
  port: "${CLOUD_DOG__A2A_SERVER__PORT:8063}"
  enabled: "${CLOUD_DOG__A2A_SERVER__ENABLED:true}"
  base_path: "/a2a"  # PS-92 canonical A2A base path. Override via env CLOUD_DOG__A2A_SERVER__BASE_PATH.

log:
  service_instance: "${FILE_MCP_SERVER_ID:file-mcp-local}"
  environment: "${CLOUD_DOG_ENVIRONMENT:dev}"
  api_server_log: "logs/api_server.log"
  web_server_log: "logs/web_server.log"
  mcp_server_log: "logs/mcp_server.log"
  a2a_server_log: "logs/a2a_server.log"
  audit_log: "logs/audit.log.jsonl"
  retention:
    hot_days: 14
    cold_days: 60
    archive_format: "gz"
  integrity:
    enabled: true
    interval_seconds: 300
    log_file: "logs/audit-integrity.log"
    hash_algorithm: "sha256"
  rotation:
    mode: "size"
    max_bytes: 104857600
    backup_count: 10
    when: "midnight"
    interval: 1
    compress: true

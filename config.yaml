profiles:
  default:
    auth:
      api_keys:
        - "${FILE_MCP_API_KEY_PRIMARY}"
      header_name: "${FILE_MCP_AUTH_HEADER_NAME}"
      header_scheme: "${FILE_MCP_AUTH_HEADER_SCHEME}"
    storage:
      backend: "${FILE_MCP_STORAGE_BACKEND}"
      tls:
        insecure_skip_verify: "${FILE_MCP_STORAGE_TLS_INSECURE}"
        ca_bundle_path: "${FILE_MCP_STORAGE_TLS_CA_BUNDLE}"
      s3:
        endpoint: "${FILE_MCP_S3_ENDPOINT}"
        bucket: "${FILE_MCP_S3_BUCKET}"
        region: "${FILE_MCP_S3_REGION}"
        access_key: "${FILE_MCP_S3_ACCESS_KEY}"
        secret_key: "${FILE_MCP_S3_SECRET_KEY}"
        prefix: "${FILE_MCP_S3_PREFIX}"
      webdav:
        base_url: "${FILE_MCP_WEBDAV_BASE_URL}"
        username: "${FILE_MCP_WEBDAV_USERNAME}"
        password: "${FILE_MCP_WEBDAV_PASSWORD}"
        move_retry_count: "${FILE_MCP_WEBDAV_MOVE_RETRY_COUNT}"
        move_retry_backoff_s: "${FILE_MCP_WEBDAV_MOVE_RETRY_BACKOFF_S}"
        move_probe_timeout_s: "${FILE_MCP_WEBDAV_MOVE_PROBE_TIMEOUT_S}"
        move_retry_statuses: "${FILE_MCP_WEBDAV_MOVE_RETRY_STATUSES}"
      ftp:
        host: "${FILE_MCP_FTP_HOST}"
        port: "${FILE_MCP_FTP_PORT}"
        username: "${FILE_MCP_FTP_USERNAME}"
        password: "${FILE_MCP_FTP_PASSWORD}"
        base_dir: "${FILE_MCP_FTP_BASE_DIR}"
        use_tls: "${FILE_MCP_FTP_USE_TLS}"
      google_drive:
        user_email: "${FILE_MCP_GDRIVE_USER_EMAIL}"
        folder_id: "${FILE_MCP_GDRIVE_FOLDER_ID}"
        folder_url: "${FILE_MCP_GDRIVE_FOLDER_URL}"
        client_id: "${FILE_MCP_GDRIVE_CLIENT_ID}"
        client_secret: "${FILE_MCP_GDRIVE_CLIENT_SECRET}"
        refresh_token: "${FILE_MCP_GDRIVE_REFRESH_TOKEN}"
        access_token: "${FILE_MCP_GDRIVE_ACCESS_TOKEN}"
        redirect_uri: "${FILE_MCP_GDRIVE_REDIRECT_URI}"
        token_uri: "${FILE_MCP_GDRIVE_TOKEN_URI}"
    scope:
      roots:
        - "${FILE_MCP_ROOT}"
      allow_globs:
        - "**/*"
      deny_globs:
        - "**/.git/**"
      allowed_exts: []
      read_only_exts: []
    audit:
      log_path: "${FILE_MCP_AUDIT_LOG}"
      include_content_hashes: true
    snapshots:
      enabled: true
      mode: "on_change"
      dir: "${FILE_MCP_SNAPSHOT_DIR}"
      retention_days: ${FILE_MCP_SNAPSHOT_RETENTION_DAYS}
      retention_count: ${FILE_MCP_SNAPSHOT_RETENTION_COUNT}
      max_storage_mb: ${FILE_MCP_SNAPSHOT_MAX_STORAGE_MB}
    validation:
      default_mode: "warn"
      per_type: {}
    conversion:
      enabled: true
      backends: []
      max_input_mb: ${FILE_MCP_CONVERSION_MAX_INPUT_MB}
    observability:
      enabled: true
      log_path: "${FILE_MCP_SERVER_LOG}"
      level: "INFO"
    limits:
      search_max_results: ${FILE_MCP_SEARCH_MAX_RESULTS}
      search_max_file_mb: ${FILE_MCP_SEARCH_MAX_FILE_MB}
      search_timeout_s: ${FILE_MCP_SEARCH_TIMEOUT_S}
      storage_timeout_s: ${FILE_MCP_STORAGE_TIMEOUT_S}
      conversion_timeout_s: ${FILE_MCP_CONVERSION_TIMEOUT_S}
    endpoint_health:
      enabled: ${FILE_MCP_ENDPOINT_HEALTH_ENABLED}
      check_on_startup: ${FILE_MCP_ENDPOINT_HEALTH_CHECK_ON_STARTUP}
      check_all_configured_backends: ${FILE_MCP_ENDPOINT_HEALTH_CHECK_ALL}
      max_retries: ${FILE_MCP_ENDPOINT_HEALTH_MAX_RETRIES}
      retry_interval_s: ${FILE_MCP_ENDPOINT_HEALTH_RETRY_INTERVAL_S}
      retry_window_s: ${FILE_MCP_ENDPOINT_HEALTH_RETRY_WINDOW_S}
      max_failures_before_restart: ${FILE_MCP_ENDPOINT_HEALTH_MAX_FAILURES_BEFORE_RESTART}
      recover_after_s: ${FILE_MCP_ENDPOINT_HEALTH_RECOVER_AFTER_S}
      restart_on_threshold: ${FILE_MCP_ENDPOINT_HEALTH_RESTART_ON_THRESHOLD}
      restart_exit_code: ${FILE_MCP_ENDPOINT_HEALTH_RESTART_EXIT_CODE}

http:
  transport: "${FILE_MCP_HTTP_TRANSPORT}"
  host: "${FILE_MCP_HTTP_HOST}"
  port: "${FILE_MCP_HTTP_PORT}"
  base_path: "${FILE_MCP_HTTP_BASE_PATH}"
  mcp_path: "${FILE_MCP_HTTP_MCP_PATH}"
  health_path: "${FILE_MCP_HTTP_HEALTH_PATH}"
  events_path: "${FILE_MCP_HTTP_EVENTS_PATH}"
  stateless_http: "${FILE_MCP_HTTP_STATELESS}"

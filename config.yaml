profiles:
  default:
    auth:
      api_keys:
      - "${FILE_MCP_API_KEY_PRIMARY}"
      header_name: ${FILE_MCP_AUTH_HEADER_NAME}
      header_scheme: ${FILE_MCP_AUTH_HEADER_SCHEME}
    storage:
      backend: ${FILE_MCP_STORAGE_BACKEND}
      tls:
        insecure_skip_verify: ${FILE_MCP_STORAGE_TLS_INSECURE}
        ca_bundle_path: ${FILE_MCP_STORAGE_TLS_CA_BUNDLE}
      s3:
        endpoint: ${FILE_MCP_S3_ENDPOINT}
        bucket: ${FILE_MCP_S3_BUCKET}
        region: ${FILE_MCP_S3_REGION}
        access_key: ${vault.dev.storage.s3.access_key_id || FILE_MCP_S3_ACCESS_KEY}
        secret_key: ${vault.dev.storage.s3.secret_access_key || FILE_MCP_S3_SECRET_KEY}
        prefix: ${FILE_MCP_S3_PREFIX}
      webdav:
        base_url: ${FILE_MCP_WEBDAV_BASE_URL}
        username: ${vault.dev.storage.webdav.username || FILE_MCP_WEBDAV_USERNAME}
        password: ${vault.dev.storage.webdav.password || FILE_MCP_WEBDAV_PASSWORD}
        move_retry_count: '3'
        move_retry_backoff_s: '1.0'
        move_probe_timeout_s: '5'
        move_retry_statuses: 423,502,503,504
      ftp:
        host: ${FILE_MCP_FTP_HOST}
        port: ${FILE_MCP_FTP_PORT}
        username: ${vault.dev.storage.ftp.username || FILE_MCP_FTP_USERNAME}
        password: ${vault.dev.storage.ftp.password || FILE_MCP_FTP_PASSWORD}
        base_dir: ${FILE_MCP_FTP_BASE_DIR}
        use_tls: ${FILE_MCP_FTP_USE_TLS}
      google_drive:
        user_email: ${FILE_MCP_GDRIVE_USER_EMAIL}
        folder_id: ${FILE_MCP_GDRIVE_FOLDER_ID}
        folder_url: ${FILE_MCP_GDRIVE_FOLDER_URL}
        client_id: ${vault.dev.storage.google_drive.client_id || FILE_MCP_GDRIVE_CLIENT_ID}
        client_secret: ${vault.dev.storage.google_drive.client_secret || FILE_MCP_GDRIVE_CLIENT_SECRET}
        refresh_token: ${FILE_MCP_GDRIVE_REFRESH_TOKEN}
        access_token: ${FILE_MCP_GDRIVE_ACCESS_TOKEN}
        redirect_uri: ${FILE_MCP_GDRIVE_REDIRECT_URI:urn:ietf:wg:oauth:2.0:oob}
        token_uri: ${FILE_MCP_GDRIVE_TOKEN_URI:https://oauth2.googleapis.com/token}
    scope:
      roots:
      - ${FILE_MCP_ROOT}
      allow_globs:
      - '**/*'
      deny_globs:
      - '**/.git/**'
      allowed_exts: []
      read_only_exts: []
    audit:
      log_path: ${FILE_MCP_AUDIT_LOG}
      include_content_hashes: true
    snapshots:
      enabled: true
      mode: on_change
      dir: ${FILE_MCP_SNAPSHOT_DIR}
      retention_days: ${FILE_MCP_SNAPSHOT_RETENTION_DAYS}
      retention_count: ${FILE_MCP_SNAPSHOT_RETENTION_COUNT}
      max_storage_mb: ${FILE_MCP_SNAPSHOT_MAX_STORAGE_MB}
    validation:
      default_mode: warn
      per_type: {}
    conversion:
      enabled: true
      backends: []
      max_input_mb: ${FILE_MCP_CONVERSION_MAX_INPUT_MB}
    observability:
      enabled: true
      log_path: ${FILE_MCP_SERVER_LOG}
      level: INFO
    limits:
      search_max_results: ${FILE_MCP_SEARCH_MAX_RESULTS}
      search_max_file_mb: ${FILE_MCP_SEARCH_MAX_FILE_MB}
      search_timeout_s: ${FILE_MCP_SEARCH_TIMEOUT_S}
      storage_timeout_s: ${FILE_MCP_STORAGE_TIMEOUT_S}
      conversion_timeout_s: ${FILE_MCP_CONVERSION_TIMEOUT_S}
http:
  transport: ${FILE_MCP_HTTP_TRANSPORT}
  host: ${FILE_MCP_HTTP_HOST}
  port: ${FILE_MCP_HTTP_PORT}
  base_path: ${FILE_MCP_HTTP_BASE_PATH}
  mcp_path: ${FILE_MCP_HTTP_MCP_PATH}
  health_path: ${FILE_MCP_HTTP_HEALTH_PATH}
  events_path: ${FILE_MCP_HTTP_EVENTS_PATH}
  stateless_http: ${FILE_MCP_HTTP_STATELESS}
